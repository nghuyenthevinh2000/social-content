name: Release App

"on":
  push:
    branches:
      - releases
    paths:
      - "tools/app/**"
      - "tools/loop/viral_analyzer/**"
      - ".github/workflows/release-app.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0; defaults to v<version> from package.json)"
        required: false
        type: string

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            artifact-path: |
              tools/app/src-tauri/target/release/bundle/dmg/*.dmg
              tools/app/src-tauri/target/release/bundle/dmg/*.zip
          - os: windows-latest
            name: windows
            artifact-path: |
              tools/app/src-tauri/target/release/bundle/msi/*.msi
              tools/app/src-tauri/target/release/bundle/nsis/*.exe
    defaults:
      run:
        working-directory: tools/app
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning]
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Setup uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app and sidecar
        run: npm run tauri build

      - name: Archive macOS .app
        if: matrix.os == 'macos-latest'
        run: |
          ditto -c -k --keepParent "src-tauri/target/release/bundle/macos/AIBrand.app" "src-tauri/target/release/bundle/dmg/AIBrand_macos_aarch64.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: aibrand-${{ matrix.name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all bundles
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          pattern: aibrand-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded bundles
        run: ls -la release-assets

      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag_name }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(jq -r .version tools/app/package.json)
            TAG="v$VERSION"
          fi

          echo "Target tag: $TAG"

          # Flatten nested directories (e.g. msi/, nsis/) into release-assets/
          find release-assets -mindepth 2 -type f -exec mv -t release-assets/ {} + 2>/dev/null || find release-assets -mindepth 2 -type f -exec mv {} release-assets/ \;
          find release-assets -mindepth 1 -type d -exec rm -rf {} +

          shopt -s nullglob
          ASSETS=()
          for f in release-assets/*; do
            if [ -f "$f" ]; then
              ASSETS+=("$f")
            fi
          done

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No release assets found in release-assets/"
            exit 1
          fi

          echo "Files to upload:"
          printf ' - %s\n' "${ASSETS[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading and updating assets..."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "AIBrand $TAG" \
              --generate-notes
          fi
