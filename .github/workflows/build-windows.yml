name: Build Windows app

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/app/**"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v5

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app + sidecar
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: viral-lab-windows
          path: |
            tools/app/src-tauri/target/release/bundle/msi/*.msi
            tools/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
