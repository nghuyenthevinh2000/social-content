services:
  windows:
    image: dockurr/windows
    container_name: windows-vm-tester
    environment:
      VERSION: "11"
      RAM_SIZE: "4G"
      CPU_CORES: "4"
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - ./binaries:/storage/shared
    stop_grace_period: 2m
    restart: on-failure
