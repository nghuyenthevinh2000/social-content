<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Poppins';font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block}
.cap{position:absolute;left:0;width:1080px;top:236px;text-align:center;font:400 44px/1.2 'Poppins';color:#f4f4f4;letter-spacing:-.005em}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-fps="30" data-width="1080" data-height="1920">
<canvas id="c" width="1080" height="1920"></canvas>
<div class="cap" id="c1"></div>
<div class="cap" id="c2" style="visibility:hidden"></div>
<script src="vendor/gsap.min.js"></script>
<script>
(function () {
const gsap = window.gsap;
const tl = gsap.timeline({ paused: true });
const ctx = document.getElementById('c').getContext('2d');
const SPEC = __SPEC__;
const TAU = Math.PI * 2, DUR = Number(document.getElementById('root').dataset.duration), X0 = 540, Y0 = 1400, DEPTH = SPEC.depth;
const BG = SPEC.light ? '#fff' : '#000', FG = SPEC.light ? '#111' : '#f2f2f2', DOT = SPEC.light ? '#000' : '#fff';
document.body.style.background = document.getElementById('root').style.background = BG;
const c1 = document.getElementById('c1'), c2 = document.getElementById('c2');
c1.textContent = SPEC.lines[0]; c2.textContent = SPEC.lines[1] || '';
c1.style.color = c2.style.color = SPEC.light ? '#111' : '#f4f4f4';
let seed = SPEC.seed;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const out3 = x => 1 - Math.pow(1 - clamp(x), 3);
const inOut = x => .5 - .5 * Math.cos(Math.PI * clamp(x));
// one dot, one line, that splits in two at every step: a 9-level branching tree
const T0 = .3, STEP = .25, GROW = .27;
const segs = [];
(function grow(x, y, ang, len, d, parent) {
  const s = { x, y, ang, len, d, parent, kids: [] };
  segs.push(s);
  if (d >= DEPTH - 1) return;
  const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
  for (const side of [-1, 1]) {
    const a = ang + side * (.27 + rnd() * .17) + (rnd() - .5) * .1;
    grow(ex, ey, a, len * (.72 + rnd() * .06), d + 1, s);
  }
})(X0, Y0, -Math.PI / 2, 228, 0, null);
const TP = T0 + (DEPTH - 1) * STEP + GROW;     // the last tips land (~2.57)
const SP = []; for (let i = 0; i < 40; i++) SP.push([rnd() * TAU, 90 + rnd() * 240, rnd() < .3 ? 5 : 3]);
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, 1080, 1920);
  const dt = t - TP;
  // a slow sway once it's grown, stronger towards the tips
  const sway = dt > 0 ? Math.sin(dt * 2.4) * .045 * Math.exp(-dt * .6) * clamp(dt * 3) : 0;
  const pos = new Map();
  ctx.strokeStyle = FG; ctx.lineCap = 'round';
  const tips = [];
  for (const s of segs) {
    const k = out3((t - (T0 + s.d * STEP)) / GROW);
    if (k <= 0) continue;
    const base = s.parent ? pos.get(s.parent) : [s.x, s.y, s.ang];
    const a = s.ang + sway * s.d * .35;
    const ex = base[0] + Math.cos(a) * s.len * k, ey = base[1] + Math.sin(a) * s.len * k;
    pos.set(s, [ex, ey]);
    ctx.lineWidth = Math.max(1, 3.2 - s.d * .28);
    ctx.globalAlpha = dt > 0 ? 1 - .5 * out3((dt - .1) / .6) : 1;
    ctx.beginPath(); ctx.moveTo(base[0], base[1]); ctx.lineTo(ex, ey); ctx.stroke();
    if (k < 1 || s.d === DEPTH - 1) tips.push([ex, ey, s.d, k]);
  }
  ctx.globalAlpha = 1; ctx.fillStyle = DOT;
  // the dots ride the growing tips (one becomes two at every split), and light up at the end
  for (const [x, y, d, k] of tips) {
    let r = Math.max(2.2, 16 * Math.pow(.74, d));
    if (dt > 0) r *= 1 + 1.4 * Math.exp(-dt * 5) * clamp(dt * 14);
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  if (t < T0) {   // the single dot before the first line
    const r = 16 * out3(t / .2);
    ctx.beginPath(); ctx.arc(X0, Y0, r, 0, TAU); ctx.fill();
  }
  if (dt > 0) {
    // pulse ring from the root and a drift of sparks off the crown
    const q = dt;
    ctx.strokeStyle = DOT; ctx.lineWidth = 3; ctx.globalAlpha = clamp(1 - q / .8) * .8;
    ctx.beginPath(); ctx.arc(X0, Y0, 20 + out3(q / .8) * 260, 0, TAU); ctx.stroke();
    for (const [a, d, r] of SP) {
      ctx.globalAlpha = clamp(q * 6) * (1 - .6 * clamp((q - .5) / .8));
      const e = out3(q / .9);
      ctx.beginPath(); ctx.arc(540 + Math.cos(a) * d * 1.7 * e, 760 + Math.sin(a) * d * e - q * 40, r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}
const st = { t: 0 };
draw(0);
tl.to(st, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => draw(st.t) }, 0);
if (SPEC.lines.length > 1) { tl.set('#c1', { visibility: 'hidden' }, TP); tl.set('#c2', { visibility: 'visible' }, TP); }
tl.set({}, {}, DUR);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
})();
</script>
</div>
</body></html>
