<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Poppins';font-weight:500;src:url(fonts/poppins-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0d0930}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0d0930;font-family:'Poppins',sans-serif}
svg{position:absolute;left:0;top:0}
.cap{position:absolute;left:0;width:1080px;top:1408px;text-align:center;font:500 46px/1.2 'Poppins';color:#fff;letter-spacing:-.005em;
  text-shadow:0 2px 14px rgba(10,5,40,.6);visibility:hidden}
.tag{position:absolute;left:0;top:0;padding:8px 18px 10px;border-radius:12px;font:600 27px/1 'Poppins';color:#fff;white-space:nowrap;
  transform-origin:0 50%;visibility:hidden}
.tag.l{transform-origin:100% 50%}
#big{padding:14px 26px 16px;border-radius:16px;font-size:36px;display:flex;align-items:center;gap:14px;background:#ff3d6e}
#big i{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#ffc93b;color:#2a1250;font:700 28px/1 'Poppins';font-style:normal}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-fps="30" data-width="1080" data-height="1920">
<svg width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c3f"/><stop offset=".55" stop-color="#0c0830"/><stop offset="1" stop-color="#26103f"/>
    </linearGradient>
    <radialGradient id="haze" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#3a1f86" stop-opacity=".45"/><stop offset="1" stop-color="#3a1f86" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#haze)"/>
  <g id="stars"></g>
  <g id="scene">
    <line id="dist" x1="540" y1="390" x2="540" y2="1360" stroke="#8d7dff" stroke-width="3" stroke-dasharray="6 12" opacity="0"/>
    <g id="planets"></g>
  </g>
</svg>
<div class="tag" id="tE" style="background:#2f8cff">Earth</div>
<div class="tag" id="tM" style="background:#8d7dff">Moon, 406,700 km away</div>
<div class="tag" id="tS" style="background:#3cf2a0;color:#0d2a1e">18,600 km spare</div>
<div class="tag l" id="tR" style="background:#7d7aa8">Mercury, Venus, Mars</div>
<div class="tag" id="big"><i>✓</i><span id="bigt"></span></div>
<div class="cap" id="c1"></div>
<div class="cap" id="c2"></div>
<div class="cap" id="c3"></div>
<script src="vendor/gsap.min.js"></script>
<script>
(function () {
const SPEC = __SPEC__;
['c1', 'c2', 'c3'].forEach((id, i) => { document.getElementById(id).textContent = SPEC.lines[i] || ''; });
document.getElementById('bigt').textContent = SPEC.tag;
const gsap = window.gsap;
const tl = gsap.timeline({ paused: true });
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
let seed = 11;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
// ---------------------------------------------- stars (dots + a few 4-point sparkles), twinkling
const sg = document.getElementById('stars');
for (let i = 0; i < 170; i++) {
  const x = rnd() * 1080, y = rnd() * 1920, r = rnd() < .85 ? 1 + rnd() * 2.2 : 3 + rnd() * 1.5;
  const c = el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: r.toFixed(1), fill: rnd() < .6 ? '#6f5fd6' : '#d9d2ff', opacity: (.35 + rnd() * .6).toFixed(2) }, sg);
  if (i % 4 === 0) tl.to(c, { opacity: .12, duration: .5 + rnd() * .6, yoyo: true, repeat: 5, ease: 'sine.inOut' }, rnd() * .6);
}
for (let i = 0; i < 14; i++) {
  const x = rnd() * 1080, y = rnd() * 1920, s = 6 + rnd() * 7;
  const p = el('path', { d: `M${x},${y - s} Q${x},${y} ${x + s},${y} Q${x},${y} ${x},${y + s} Q${x},${y} ${x - s},${y} Q${x},${y} ${x},${y - s}Z`, fill: '#b9aaff', opacity: .7 }, sg);
  tl.to(p, { opacity: .2, duration: .7, yoyo: true, repeat: 3, ease: 'sine.inOut' }, rnd());
}
// ---------------------------------------------- the column, to scale: Earth centre at y 300, Moon centre 406,700 km below (apogee)
const Y0 = 390, Y1 = 1360, KM = (Y1 - Y0) / 406700;
const rE = 6371 * KM, rM = 1737 * KM;
const PL = [
  ['Mercury', 4879, ['#bdb6cf', '#8a82a3'], '#6b6a8f'],
  ['Venus', 12104, ['#ffd98a', '#e9a45a'], '#e9a45a'],
  ['Mars', 6779, ['#ff7a5c', '#c4433b'], '#ff5a4d'],
  ['Jupiter', 139820, ['#f7cf9b', '#e39b67', '#f8e6c4', '#c97c58'], '#f08a4b'],
  ['Saturn', 116460, ['#f7dfa6', '#e3b871', '#f8ecc8'], '#e9b44c'],
  ['Uranus', 50724, ['#9ff0ee', '#62cfd8'], '#2fc6c9'],
  ['Neptune', 49244, ['#6d93ff', '#3d5fe0'], '#4a6bff'],
];
const pg = document.getElementById('planets');
let uid = 0;
function planet(cx, cy, r, cols, opts = {}) {
  const g = el('g', {}, pg);
  const id = 'cp' + (uid++);
  const cp = el('clipPath', { id }, g); el('circle', { cx, cy, r }, cp);
  el('circle', { cx, cy, r: r * 1.12, fill: cols[0], opacity: .5, filter: 'url(#glow)' }, g);       // halo
  if (opts.rings) el('ellipse', { cx, cy, rx: r * 2.15, ry: r * .42, fill: 'none', stroke: '#e7c98d', 'stroke-width': r * .2, opacity: .85, transform: `rotate(-14 ${cx} ${cy})` }, g);
  const body = el('g', { 'clip-path': `url(#${id})` }, g);
  el('circle', { cx, cy, r, fill: cols[0] }, body);
  if (cols.length > 2) {          // bands
    for (let k = 0; k < 7; k++) {
      const yy = cy - r + (k + .5) * (2 * r / 7);
      el('rect', { x: cx - r, y: yy - r * .06 - (k % 2) * r * .03, width: 2 * r, height: r * (.1 + (k % 3) * .05), fill: cols[1 + (k % (cols.length - 1))], opacity: .8 }, body);
    }
  } else {                        // blotches
    for (let k = 0; k < 5; k++) el('ellipse', { cx: cx + (rnd() - .3) * r * 1.2, cy: cy + (rnd() - .5) * r * 1.4, rx: r * (.18 + rnd() * .2), ry: r * (.1 + rnd() * .12), fill: cols[1], opacity: .75 }, body);
  }
  if (opts.earth) for (const [dx, dy, a, b] of [[-.3, -.2, .5, .35], [.35, .25, .4, .3], [.1, -.55, .3, .18]]) el('ellipse', { cx: cx + dx * r, cy: cy + dy * r, rx: a * r, ry: b * r, fill: '#3fd28f' }, body);
  el('ellipse', { cx: cx - r * .55, cy, rx: r * 1.02, ry: r * 1.25, fill: '#1c1653', opacity: .78 }, body);   // night side (lit from the right)
  el('circle', { cx: cx + r * .35, cy: cy - r * .38, r: r * .22, fill: '#fff', opacity: .16, filter: 'url(#soft)' }, body);
  if (opts.rings) el('path', { d: `M${cx - r * 2.15},${cy} A${r * 2.15},${r * .42} 0 0 0 ${cx + r * 2.15},${cy}`, fill: 'none', stroke: '#f3dca7', 'stroke-width': r * .2, opacity: .95, transform: `rotate(-14 ${cx} ${cy})` }, g);
  return g;
}
const earth = planet(540, Y0, rE, ['#3aa0ff', '#2b7fe0'], { earth: true });
const moon = planet(540, Y1, rM, ['#ddd7f0', '#b5adcf']);
// transforms are set by hand (GSAP's svgOrigin shifts groups when it is set more than once)
const pop = (g, cx, cy, t, from = 0) => { const st = { p: 0 }; const f = () => g.setAttribute('transform', `translate(${cx} ${cy}) scale(${Math.max(1e-3, from + (1 - from) * st.p)}) translate(${-cx} ${-cy})`); f(); tl.to(st, { p: 1, duration: .35, ease: 'back.out(2.5)', onUpdate: f }, t); };
pop(earth, 540, Y0, .05); pop(moon, 540, Y1, .12);
tl.to('#dist', { opacity: .75, duration: .3 }, .2);
const tag = (id, x, y, t, left) => {
  const d = document.getElementById(id);
  gsap.set(d, { x: left ? x - d.offsetWidth : x, y: y - d.offsetHeight / 2 });
  tl.set(d, { visibility: 'visible' }, t);
  tl.fromTo(d, { scale: 0 }, { scale: 1, duration: .25, ease: 'back.out(2.2)' }, t);
};
tag('tE', 580, Y0, .2); tag('tM', 580, Y1, .25, false);
// planets drop into the gap one after another, top down, from alternate sides
let y = Y0 + rE;
const T0 = .45, STEP = .29;
PL.forEach(([name, d, cols, tc], i) => {
  const r = d / 2 * KM, cy = y + r; y += 2 * r;
  const g = planet(540, cy, r, cols, { rings: name === 'Saturn' });
  const t = T0 + i * STEP, side = i % 2 ? 1 : -1;
  const st = { p: 0 };
  const f = () => { const q = 1 - st.p; g.setAttribute('transform', `translate(${side * 760 * q} 0) rotate(${side * 40 * q} 540 ${cy})`); };
  f(); tl.to(st, { p: 1, duration: .34, ease: 'back.out(1.25)', onUpdate: f }, t);
  if (r < 30) return;            // the three small ones share one label
  const tg = document.createElement('div'); tg.className = 'tag' + (side < 0 ? ' l' : ''); tg.id = 't' + name; tg.textContent = name; tg.style.background = tc;
  document.getElementById('root').appendChild(tg);
  const tx = side < 0 ? 540 - Math.max(r, 10) - 26 : 540 + Math.max(r, 10) + 26;
  gsap.set(tg, { x: side < 0 ? tx - tg.offsetWidth : tx, y: cy - tg.offsetHeight / 2 });
  tl.set(tg, { visibility: 'visible' }, t + .2);
  tl.fromTo(tg, { scale: 0 }, { scale: 1, duration: .22, ease: 'back.out(2.2)' }, t + .2);
});
// payoff: the last one lands, the column pulses, the big tag pops, the spare gap shows
const TP = T0 + 6 * STEP + .34;          // ~2.53
tag('tR', 540 - 40, Y0 + rE + 30, T0 + 2 * STEP + .2, true);
// the spare room above the Moon: a bright bracket on the left
const gy0 = y + 3, gy1 = Y1 - rM - 3, sc = document.getElementById('scene');
const br = el('path', { d: `M478,${gy0} h-16 V${gy1} h16`, fill: 'none', stroke: '#3cf2a0', 'stroke-width': 5, 'stroke-linecap': 'round', opacity: 0 }, sc);
tl.to(br, { opacity: 1, duration: .15 }, TP);
tag('tS', 446, (gy0 + gy1) / 2, TP + .08, true);
tl.to('#dist', { stroke: '#3cf2a0', opacity: 1, duration: .2 }, TP);
tl.fromTo('#scene', { scale: 1, svgOrigin: '540 815' }, { scale: 1.035, svgOrigin: '540 815', duration: .12, ease: 'power2.out', immediateRender: false }, TP);
tl.to('#scene', { scale: 1, svgOrigin: '540 815', duration: .45, ease: 'back.out(2)' }, TP + .12);
const big = document.getElementById('big');
gsap.set(big, { x: 540 - big.offsetWidth / 2, y: 250, transformOrigin: '50% 50%' });
tl.set(big, { visibility: 'visible' }, TP + .05);
tl.fromTo(big, { scale: 0, rotation: -8 }, { scale: 1, rotation: -3, duration: .32, ease: 'back.out(2.6)' }, TP + .05);
// slow camera drift on the whole scene
tl.fromTo('#planets', { y: 14 }, { y: -10, duration: 4, ease: 'none', immediateRender: true }, 0);
// captions
tl.set('#c1', { visibility: 'visible' }, .15); tl.set('#c1', { visibility: 'hidden' }, 1.3);
tl.set('#c2', { visibility: 'visible' }, 1.3); tl.set('#c2', { visibility: 'hidden' }, TP);
tl.set('#c3', { visibility: 'visible' }, TP);
tl.set({}, {}, 4.0);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
})();
</script>
</div>
</body></html>
