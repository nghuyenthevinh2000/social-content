<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero direction preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #181c1a;
      color: #f3f3ed;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, a { font: inherit; }
    .workspace { max-width: 1600px; margin: auto; padding: clamp(18px, 3vw, 44px); }
    .workspace-header, .workspace-footer { display: flex; justify-content: space-between; gap: 20px; align-items: baseline; }
    .workspace-header { padding-bottom: 24px; border-bottom: 1px solid #404641; }
    .workspace-header h1 { font-size: 15px; letter-spacing: -.02em; margin: 0; font-weight: 600; }
    .workspace-header span, .workspace-footer, .meta, .section-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    }
    .workspace-header span { color: #aeb7ac; }
    .choice-header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 30px 0 14px; }
    .choice-header p { margin: 0; }
    .choice-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
    .choice { appearance: none; display: flex; flex-direction: column; align-items: start; gap: 11px; min-height: 145px; width: 100%; border: 1px solid #404641; background: #222923; color: #f3f3ed; text-align: left; padding: 18px; cursor: pointer; border-radius: 0; }
    .choice:hover, .choice:focus-visible { border-color: #bfc9b9; }
    .choice[aria-pressed="true"] { border-color: #f3f3ed; background: #303a31; }
    .choice-name { font-size: 18px; letter-spacing: -.03em; }
    .choice-note { font-size: 12px; line-height: 1.45; color: #b7c0b4; flex: 1; }
    .choice-colors { display: flex; gap: 4px; }
    .choice-colors i { display: block; width: 22px; height: 12px; border: 1px solid #ffffff44; }
    .preview-header { display: flex; justify-content: space-between; gap: 18px; align-items: end; padding: 28px 0 18px; }
    .preview-header h2 { margin: 6px 0 0; font-size: clamp(22px, 3vw, 36px); letter-spacing: -.05em; font-weight: 500; }
    .preview-controls { display: flex; align-items: center; gap: 16px; }
    .preview-controls button { background: transparent; color: #f3f3ed; border: 1px solid #59645b; padding: 9px 13px; cursor: pointer; }
    .preview-controls button:hover, .preview-controls button:focus-visible { border-color: #f3f3ed; }
    .meta { color: #aeb7ac; }
    .canvas-frame { border: 1px solid #404641; padding: clamp(8px, 1vw, 14px); background: #242a25; }
    .hero {
      --bg: #e9e6de; --surface: #f5f3ec; --ink: #232820; --muted: #6b7169;
      --accent: #c95536; --line: #c9ccc3; --radius: 4px;
      --display: Georgia, 'Times New Roman', serif;
      --body: ui-sans-serif, system-ui, sans-serif;
      --max-width: 1240px;
      background: var(--bg); color: var(--ink); font-family: var(--body); min-height: 680px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .hero-inner { width: min(100% - clamp(36px, 8vw, 120px), var(--max-width)); margin-inline: auto; }
    .site-header { min-height: 88px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .logo { font-size: 22px; font-weight: 800; letter-spacing: -.08em; }
    .site-nav { display: flex; gap: clamp(16px, 3vw, 42px); color: var(--ink); font-size: 12px; }
    .hero-content { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .9fr); gap: clamp(28px, 5vw, 84px); align-items: center; padding-block: 55px; }
    .copy { padding-block: 20px; }
    .eyebrow, .footnote, .visual-index, .visual-caption, .interface-label, .interface-metric-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px;
      line-height: 1.5; letter-spacing: .12em; text-transform: uppercase;
    }
    .eyebrow { color: var(--accent); margin: 0 0 30px; }
    .headline { font-family: var(--display); font-weight: 400; font-size: clamp(54px, 6.7vw, 105px); line-height: .97; letter-spacing: -.065em; margin: 0; max-width: 780px; overflow-wrap: anywhere; }
    .description { max-width: 440px; margin: 30px 0 0; font-size: clamp(15px, 1.4vw, 19px); line-height: 1.55; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 27px; margin-top: 37px; }
    .actions a { text-decoration: none; font-size: 12px; font-weight: 600; }
    .primary-action { background: var(--accent); color: var(--surface); border: 1px solid var(--accent); padding: 16px 21px; border-radius: var(--radius); }
    .secondary-action { color: var(--ink); border-bottom: 1px solid var(--ink); padding: 10px 0; }
    .visual-wrap { min-width: 0; }
    .visual-meta { display: flex; justify-content: space-between; gap: 12px; padding: 0 0 12px; color: var(--muted); }
    .visual-stage { position: relative; min-height: 420px; aspect-ratio: 1 / 1.08; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .visual-stage img { display: block; width: 100%; height: 100%; position: absolute; inset: 0; object-fit: cover; }
    .visual-stage:has(img) { background: var(--surface); }
    .visual-error { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }
    .interface-visual { width: 100%; height: 100%; position: absolute; inset: 0; display: flex; flex-direction: column; padding: clamp(20px, 3vw, 42px); background: var(--surface); }
    .interface-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
    .interface-mark { width: 30px; height: 30px; border: 1px solid var(--accent); transform: rotate(45deg); }
    .interface-main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .interface-title { font-family: var(--display); font-weight: 400; font-size: clamp(36px, 4vw, 64px); letter-spacing: -.055em; line-height: 1.04; margin: 16px 0; }
    .interface-description { color: var(--muted); font-size: 13px; line-height: 1.5; max-width: 240px; margin: 0; }
    .interface-bottom { display: flex; justify-content: space-between; align-items: end; border-top: 1px solid var(--line); padding-top: 18px; gap: 14px; }
    .interface-metric { font-family: var(--display); font-size: 56px; line-height: .85; color: var(--accent); letter-spacing: -.06em; }
    .abstract-visual { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 72% 20%, var(--surface), transparent 55%), var(--bg); }
    .abstract-shape { width: 65%; aspect-ratio: 1; border: clamp(28px, 5vw, 72px) solid var(--accent); border-radius: 50% 50% 3% 50%; transform: rotate(-25deg); }
    .abstract-line { position: absolute; inset: 12%; border: 1px solid var(--line); transform: rotate(16deg); pointer-events: none; }
    .site-footer { display: flex; justify-content: space-between; gap: 20px; border-top: 1px solid var(--line); padding-block: 22px; color: var(--muted); }
    .site-footer p { margin: 0; }
    .hero[data-layout="centered"] .hero-content { grid-template-columns: 1fr; text-align: center; gap: 40px; }
    .hero[data-layout="centered"] .copy { display: flex; flex-direction: column; align-items: center; padding: 20px 0 0; }
    .hero[data-layout="centered"] .headline { max-width: 950px; }
    .hero[data-layout="centered"] .visual-wrap { width: min(100%, 840px); margin: auto; }
    .hero[data-layout="centered"] .visual-stage { aspect-ratio: 16 / 9; min-height: 350px; }
    .hero[data-layout="editorial"] .hero-content { grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); align-items: end; }
    .hero[data-layout="editorial"] .copy { align-self: start; padding-top: 60px; }
    .hero[data-layout="editorial"] .visual-stage { aspect-ratio: 3 / 4; }
    .direction { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 5vw, 80px); padding: 36px 0 40px; border-bottom: 1px solid #404641; }
    .section-label { color: #aeb7ac; margin: 0 0 14px; }
    .direction p:not(.section-label) { font-size: 15px; line-height: 1.6; color: #e2e6db; margin: 0; max-width: 640px; }
    .tokens { display: flex; flex-wrap: wrap; gap: 14px 26px; }
    .token { display: flex; align-items: center; gap: 8px; min-width: 110px; }
    .swatch { width: 22px; height: 22px; border: 1px solid #818b80; }
    .token small { font: 10px ui-monospace, monospace; color: #d2d9cd; }
    .spec { padding: 40px 0 60px; border-bottom: 1px solid #404641; }
    .spec h2 { font-size: clamp(25px, 3vw, 38px); font-weight: 500; letter-spacing: -.05em; margin: 0 0 24px; }
    .spec-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .spec-block { border: 1px solid #404641; padding: clamp(18px, 2vw, 30px); min-width: 0; }
    .spec-block h3 { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; margin: 0 0 22px; color: #d3decf; }
    .spec-block dl { margin: 0; }
    .spec-block dt { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; color: #aeb7ac; margin: 17px 0 6px; }
    .spec-block dt:first-child { margin-top: 0; }
    .spec-block dd { margin: 0; color: #f0f2e9; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
    .spec-block ul { margin: 0; padding-left: 19px; color: #f0f2e9; font-size: 14px; line-height: 1.65; }
    .spec-block li + li { margin-top: 9px; }
    .workspace-footer { padding-top: 20px; color: #aeb7ac; }
    .error { padding: 80px 24px; background: #f5f3ec; color: #232820; line-height: 1.6; }
    .error h3 { margin-top: 0; }
    .error code { overflow-wrap: anywhere; }
    @media (max-width: 820px) {
      .hero-content, .hero[data-layout="editorial"] .hero-content { grid-template-columns: 1fr; padding-block: 35px; }
      .hero[data-layout="editorial"] .copy { padding-top: 0; }
      .visual-stage, .hero[data-layout="editorial"] .visual-stage { min-height: 350px; aspect-ratio: 4 / 3; }
      .direction, .spec-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .workspace-header span, .site-nav, .preview-header .meta { display: none; }
      .site-header { min-height: 66px; }
      .headline { font-size: clamp(48px, 12vw, 72px); }
      .visual-stage, .hero[data-layout="editorial"] .visual-stage, .hero[data-layout="centered"] .visual-stage { min-height: 320px; aspect-ratio: 1 / 1; }
      .site-footer { flex-wrap: wrap; }
      .preview-header { align-items: start; flex-direction: column; }
      .preview-header .preview-controls .meta { display: inline; }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <header class="workspace-header">
      <h1>Design / Hero preview</h1>
      <span>JSON-DRIVEN DESIGN STUDY · <span id="choice-count">—</span></span>
    </header>
    <section aria-label="Compare design choices">
      <div class="choice-header"><p class="section-label">CHOOSE A DIRECTION</p><p class="meta">SELECT A CARD TO COMPARE</p></div>
      <div class="choice-list" id="choices"></div>
    </section>
    <div class="preview-header">
      <div>
        <span class="meta" id="project">LOADING PROJECT</span>
        <h2 id="direction-title">Loading direction…</h2>
      </div>
      <div class="preview-controls">
        <button type="button" id="previous" aria-label="Previous design direction">← Previous</button>
        <span class="meta" id="layout-label"></span>
        <button type="button" id="next" aria-label="Next design direction">Next →</button>
      </div>
    </div>
    <div class="canvas-frame" id="canvas">
      <article class="hero" id="hero" aria-label="Hero design preview">
        <header class="site-header hero-inner">
          <span class="logo" id="logo"></span>
          <nav class="site-nav" id="nav" aria-label="Preview navigation"></nav>
        </header>
        <div class="hero-content hero-inner">
          <section class="copy">
            <p class="eyebrow" id="eyebrow"></p>
            <h3 class="headline" id="headline"></h3>
            <p class="description" id="description"></p>
            <div class="actions" id="actions"></div>
          </section>
          <aside class="visual-wrap" aria-label="Hero visual">
            <div class="visual-meta">
              <span class="visual-caption" id="visual-caption"></span>
              <span class="visual-index" id="visual-index"></span>
            </div>
            <div class="visual-stage" id="visual-stage"></div>
          </aside>
        </div>
        <footer class="site-footer hero-inner footnote">
          <p id="footer-left"></p><p id="footer-right"></p>
        </footer>
      </article>
    </div>
    <section class="direction" id="direction" aria-label="Design direction">
      <div>
        <p class="section-label">01 / DESIGN INTENT</p>
        <p id="notes"></p>
      </div>
      <div>
        <p class="section-label">02 / COLOR SYSTEM</p>
        <div class="tokens" id="tokens"></div>
      </div>
    </section>
    <section class="spec" id="design-spec" aria-label="Complete design specification">
      <p class="section-label">03 / DESIGN-FIRST UI PROMPT SKELETON</p>
      <h2>Full design specification</h2>
      <div class="spec-grid" id="spec-grid"></div>
    </section>
    <footer class="workspace-footer" id="preview-end"><span>EDIT THE JSON · RELOAD TO COMPARE</span><span id="design-summary"></span></footer>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const text = (id, value) => { $(id).textContent = value ?? ''; };
    const fonts = {
      editorial: { display: "Georgia, 'Times New Roman', serif", body: "ui-sans-serif, system-ui, sans-serif" },
      modern: { display: "Arial, Helvetica, sans-serif", body: "Arial, Helvetica, sans-serif" },
      classic: { display: "'Times New Roman', Georgia, serif", body: "Georgia, 'Times New Roman', serif" }
    };
    const layouts = ['split', 'centered', 'editorial'];
    const visuals = ['interface', 'image', 'abstract'];
    const colorKeys = ['background', 'surface', 'ink', 'muted', 'accent', 'line'];
    const specSections = [
      ['GOAL', 'goal', [['What are we making?', 'what'], ['Who is it for?', 'audience'], ['Success criteria', 'successCriteria']]],
      ['FORMAT', 'format', [['Canvas size / aspect ratio', 'canvas'], ['Safe margins & padding', 'safeMargins']]],
      ['LAYOUT', 'layout', [['Grid', 'grid'], ['Placement', 'placement'], ['Visual hierarchy', 'hierarchy']]],
      ['TYPE SYSTEM', 'typeSystem', [['Primary display', 'display'], ['Monospaced metadata', 'metadata'], ['Contrast', 'contrast']]],
      ['COLOR + MATERIAL', 'colorMaterial', [['Foundation', 'foundation'], ['Surfaces', 'surfaces'], ['Borders', 'borders'], ['Signal color', 'signal']]],
      ['COPY (RENDER EXACTLY)', 'copy', [['Headline', 'headline'], ['Subtitle', 'subtitle'], ['Actions', 'actions']]],
      ['CONSTRAINTS · CHANGE 1–2 VARIABLES PER ITERATION', 'constraints', [['Font', 'font'], ['Accent', 'accent'], ['Container', 'container']]],
      ['NEGATIVE PROMPT', 'negativePrompt', null]
    ];

    function addText(parent, className, value, tag = 'span') {
      const element = document.createElement(tag);
      element.className = className;
      element.textContent = value ?? '';
      parent.append(element);
      return element;
    }

    function renderInterface(stage, data) {
      const panel = document.createElement('div');
      panel.className = 'interface-visual';
      const top = addText(panel, 'interface-top', '', 'div');
      addText(top, 'interface-label', data.label);
      addText(top, 'interface-mark', '').setAttribute('aria-hidden', 'true');
      const main = addText(panel, 'interface-main', '', 'div');
      addText(main, 'interface-title', data.title, 'h4');
      addText(main, 'interface-description', data.description, 'p');
      const bottom = addText(panel, 'interface-bottom', '', 'div');
      addText(bottom, 'interface-metric', data.metric);
      addText(bottom, 'interface-metric-label', data.metricLabel);
      stage.append(panel);
    }

    function renderVisual(stage, mode, visual) {
      stage.replaceChildren();
      if (mode === 'image' && visual.imageUrl) {
        const image = document.createElement('img');
        image.src = visual.imageUrl;
        image.alt = visual.imageAlt || '';
        image.onerror = () => {
          stage.replaceChildren();
          addText(stage, 'visual-error', 'Image unavailable. Check visual.imageUrl in the JSON.', 'p');
        };
        stage.append(image);
      } else if (mode === 'abstract') {
        const art = addText(stage, 'abstract-visual', '', 'div');
        addText(art, 'abstract-shape', '').setAttribute('aria-hidden', 'true');
        addText(art, 'abstract-line', '').setAttribute('aria-hidden', 'true');
      } else {
        renderInterface(stage, visual.interface || {});
      }
    }

    function renderSpec(spec) {
      const grid = $('spec-grid');
      grid.replaceChildren();
      for (const [heading, key, fields] of specSections) {
        const block = addText(grid, 'spec-block', '', 'section');
        addText(block, '', heading, 'h3');
        if (key === 'negativePrompt') {
          const list = addText(block, '', '', 'ul');
          for (const item of Array.isArray(spec[key]) ? spec[key] : []) addText(list, '', item, 'li');
          continue;
        }
        const list = addText(block, '', '', 'dl');
        for (const [label, field] of fields) {
          addText(list, '', label, 'dt');
          const value = spec[key]?.[field];
          addText(list, '', Array.isArray(value) ? value.map((action) => action.label).join(' / ') : (value || '—'), 'dd');
        }
      }
    }

    function render(config, direction) {
      const design = direction.design || {};
      const hero = direction.hero || {};
      const visual = direction.visual || {};
      const spec = direction.spec || {};
      const copy = spec.copy || {};
      const colors = design.colors || {};
      const canvas = $('hero');
      const layout = layouts.includes(design.layout) ? design.layout : 'split';
      const mode = visuals.includes(design.visual) ? design.visual : 'interface';
      const font = fonts[design.font] || fonts.editorial;
      canvas.dataset.layout = layout;
      canvas.style.setProperty('--display', font.display);
      canvas.style.setProperty('--body', font.body);
      canvas.style.setProperty('--max-width', typeof design.containerWidth === 'string' && /^\d{2,4}px$/.test(design.containerWidth) ? design.containerWidth : '1240px');
      canvas.style.setProperty('--radius', typeof design.cornerRadius === 'string' && /^\d{1,2}px$/.test(design.cornerRadius) ? design.cornerRadius : '4px');
      const defaults = { background: '#e9e6de', surface: '#f5f3ec', ink: '#232820', muted: '#6b7169', accent: '#c95536', line: '#c9ccc3' };
      for (const key of colorKeys) {
        const value = typeof colors[key] === 'string' && CSS.supports('color', colors[key]) ? colors[key] : defaults[key];
        canvas.style.setProperty(`--${key === 'background' ? 'bg' : key}`, value);
      }
      text('project', config.project);
      text('direction-title', direction.name);
      text('layout-label', `${layout} / ${mode}`);
      text('logo', hero.topLabel);
      text('eyebrow', hero.eyebrow);
      text('headline', copy.headline);
      text('description', copy.subtitle);
      text('footer-left', hero.footerLeft);
      text('footer-right', hero.footerRight);
      text('visual-caption', visual.caption);
      text('visual-index', visual.index);
      text('notes', direction.notes);
      text('design-summary', `${design.font || 'editorial'} TYPE / ${layout} GRID`);

      const nav = $('nav');
      nav.replaceChildren();
      for (const label of Array.isArray(hero.navigation) ? hero.navigation : []) addText(nav, 'nav-item', label);

      const actions = $('actions');
      actions.replaceChildren();
      for (const [index, className] of ['primary-action', 'secondary-action'].entries()) {
        const action = copy.actions?.[index];
        if (!action?.label) continue;
        const link = addText(actions, className, action.label, 'a');
        link.href = typeof action.href === 'string' && /^#[\w-]+$/.test(action.href) ? action.href : '#preview-end';
      }
      renderVisual($('visual-stage'), mode, visual);
      renderSpec(spec);

      const tokens = $('tokens');
      tokens.replaceChildren();
      for (const key of colorKeys) {
        if (!colors[key]) continue;
        const token = addText(tokens, 'token', '', 'div');
        const swatch = addText(token, 'swatch', '');
        if (CSS.supports('color', colors[key])) swatch.style.background = colors[key];
        addText(token, '', `${key} ${colors[key]}`, 'small');
      }
      document.title = `${direction.name || 'Hero'} — ${config.project || 'design preview'}`;
    }

    function renderChoices(config) {
      if (!Array.isArray(config.directions) || config.directions.length === 0) {
        throw new Error('Add at least one entry to the directions array.');
      }
      const choices = $('choices');
      choices.replaceChildren();
      text('choice-count', `${String(config.directions.length).padStart(2, '0')} DIRECTIONS`);
      const buttons = config.directions.map((direction, index) => {
        const button = addText(choices, 'choice', '', 'button');
        button.type = 'button';
        addText(button, 'meta', `${String(index + 1).padStart(2, '0')} / ${String(config.directions.length).padStart(2, '0')}`);
        addText(button, 'choice-name', direction.name || `Direction ${index + 1}`);
        addText(button, 'choice-note', direction.notes);
        const swatches = addText(button, 'choice-colors', '', 'span');
        for (const key of ['background', 'ink', 'accent']) {
          const swatch = addText(swatches, '', '', 'i');
          const color = direction.design?.colors?.[key];
          if (typeof color === 'string' && CSS.supports('color', color)) swatch.style.background = color;
        }
        button.addEventListener('click', () => select(index));
        return button;
      });
      let selected = 0;
      function select(index) {
        selected = (index + config.directions.length) % config.directions.length;
        buttons.forEach((button, i) => button.setAttribute('aria-pressed', String(i === selected)));
        render(config, config.directions[selected]);
      }
      $('previous').addEventListener('click', () => select(selected - 1));
      $('next').addEventListener('click', () => select(selected + 1));
      select(0);
    }

    fetch(new URL('./design_hero_preview.json', document.baseURI), { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(renderChoices)
      .catch((error) => {
        $('canvas').replaceChildren();
        const message = addText($('canvas'), 'error', '', 'section');
        addText(message, '', 'Could not load design_hero_preview.json', 'h3');
        addText(message, '', 'Serve this folder over HTTP, then reload. Check that the JSON is valid and sits beside the HTML.', 'p');
        addText(message, '', `Details: ${error.message}`, 'code');
        text('direction-title', 'Preview unavailable');
      });
  </script>
</body>
</html>
