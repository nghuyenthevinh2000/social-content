<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jev Suggestion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <h1>Jev Suggestion</h1>
    <p class="subtitle">
      Type a request. Top section: which skill Jev picks. Bottom section:
      which resource inside that skill Jev picks. Longer, brighter bar wins.
    </p>

    <section class="chart-section">
      <div class="section-title">1 · Skill</div>
      <div class="chart" id="skillsChart">
        <div class="chart-empty">ask something to begin</div>
      </div>
    </section>

    <section class="chart-section">
      <div class="section-title">2 · Resource within that skill</div>
      <div class="chart" id="resourcesChart">
        <div class="chart-empty">waiting on a skill first</div>
      </div>
    </section>

    <form id="form" class="input-row">
      <textarea
        id="text"
        placeholder="Write a sentence, a request, anything…"
        rows="3"
        autofocus
      ></textarea>
      <button type="submit" id="submit">Ask Jev</button>
    </form>

    <div class="status" id="status">&nbsp;</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
