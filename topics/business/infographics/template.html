<!DOCTYPE html>
<!--
  Traps vs. Solutions infographic template.
  Data: pass `window.__DATA__` (e.g. Playwright add_init_script) or `?data=path/to/file.json`
  (needs an http server; fetch is blocked on file://).
  Schema: { title, subtitle, pairs: [{ trap:{title,description,tag?}, solution:{title,description,tag?} }] }
  Any number of pairs works: card text/spacing auto-scales to fit a fixed 1280-wide canvas.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Traps vs. Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #E6DCCE; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  #canvas {
    --title: 19px; --desc: 16px; --gap: 10px; --pad: 12px;
    width: 1280px; min-height: 720px; margin: 0 auto; padding: 28px 40px 32px;
    background: #F8F3EA; color: #1A1A1A;
  }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: 48px; line-height: 1.05; letter-spacing: 1.2px; margin-top: 6px; }
  .subtitle { font-size: 17px; font-weight: 600; color: #63584F; margin-top: 4px; }
  header { border-bottom: 2px solid #E2D5C3; padding-bottom: 14px; margin-bottom: 14px; }
  /* minmax(0,1fr) stops long content from stretching a column past the canvas */
  .grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); column-gap: 20px; row-gap: var(--gap); }
  .col-head { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1.2px;
    padding-bottom: 6px; border-bottom: 3px solid; }
  .col-head.trap { color: #B23B3B; border-color: #E85D5D; }
  .col-head.sol { color: #226543; border-color: #2F855A; }
  .card { padding: var(--pad) 16px; border-radius: 6px; border: 1px solid; border-left-width: 6px; min-width: 0; }
  .trap-card { background: #FDF1ED; border-color: #F5DCD5; border-left-color: #E85D5D; }
  .sol-card { background: #fff; border-color: #E2E8F0; border-left-color: #2F855A; }
  .top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 3px; }
  .num { font-family: 'Bebas Neue', sans-serif; font-size: 18px; flex: none; line-height: 1.3; }
  .trap-card .num { color: #E85D5D; } .sol-card .num { color: #2F855A; }
  .name { font-size: var(--title); font-weight: 700; line-height: 1.25; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .trap-card .name { color: #8C2525; } .sol-card .name { color: #1A5434; }
  .tag { flex: none; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .trap-card .tag { background: #FEE2E2; color: #991B1B; } .sol-card .tag { background: #DCFCE7; color: #166534; }
  .desc { font-size: var(--desc); font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
  .trap-card .desc { color: #4A3E37; } .sol-card .desc { color: #263344; }
</style>
</head>
<body>
<div id="canvas">
  <header><h1 id="title"></h1><p class="subtitle" id="subtitle"></p></header>
  <div class="grid" id="grid"></div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2 = n => String(n).padStart(2, '0');

async function loadData() {
  if (window.__DATA__) return window.__DATA__;
  const p = new URLSearchParams(location.search).get('data') || 'data.json';
  return (await fetch(p)).json();
}

function render(d) {
  const pairs = d.pairs || [];
  document.title = d.title || document.title;
  document.getElementById('title').textContent = d.title || '';
  document.getElementById('subtitle').textContent = d.subtitle || '';

  // Scale type & spacing down as pairs increase so the canvas stays compact
  const c = document.getElementById('canvas').style;
  const n = pairs.length;
  const s = n <= 5 ? [20, 17, 12, 14] : n <= 8 ? [19, 16, 10, 12] : [17, 14, 8, 9];
  c.setProperty('--title', s[0] + 'px'); c.setProperty('--desc', s[1] + 'px');
  c.setProperty('--gap', s[2] + 'px');   c.setProperty('--pad', s[3] + 'px');

  const card = (kind, label, i, x) => `
    <div class="card ${kind}-card">
      <div class="top"><span class="num">${label} ${pad2(i + 1)}</span>
        <span class="name">${esc(x.title)}</span>${x.tag ? `<span class="tag">${esc(x.tag)}</span>` : ''}</div>
      <div class="desc">${esc(x.description)}</div>
    </div>`;

  // One grid row per pair keeps each trap aligned with its solution
  document.getElementById('grid').innerHTML =
    `<div class="col-head trap">${n} Failure Mental Traps</div><div class="col-head sol">${n} Practical Solutions</div>` +
    pairs.map((p, i) => card('trap', 'TRAP', i, p.trap) + card('sol', 'SOL', i, p.solution)).join('');
  document.body.dataset.ready = '1';
}

loadData().then(render);
</script>
</body>
</html>
